name: Fedora Dev Build (Lunar Vulkan SDK)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  APPLICATION_NAME: gfpgan-ncnn-vulkan
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  dev-build-fedora-lunar-sdk:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:

    - name: Install dependencies
      run: |
        dnf update -y
        dnf install wget curl git opencv-devel opencv python3-opencv \
          libomp libomp-devel clang cmake gcc gcc-c++ glslang python3 -y

    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Patch CMake minimum version in submodules
      run: |
        python3 -c "
        import os, re
        for root, dirs, files in os.walk('src/external'):
            for file in files:
                if file == 'CMakeLists.txt':
                    path = os.path.join(root, file)
                    with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                        content = f.read()
                    def bump_version(match):
                        version_str = match.group(1)
                        try:
                            parts = [int(x) for x in version_str.split('.')]
                            if len(parts) >= 2 and (parts[0] < 3 or (parts[0] == 3 and parts[1] < 5)):
                                return 'cmake_minimum_required(VERSION 3.5)'
                        except:
                            pass
                        return match.group(0)
                    new_content = re.sub(r'cmake_minimum_required\s*\(\s*VERSION\s+([0-9.]+)\s*\)', bump_version, content, flags=re.IGNORECASE)
                    if new_content != content:
                        with open(path, 'w', encoding='utf-8') as f:
                            f.write(new_content)
                        print(f'Patched {path}')
        "
    - name: cache-vulkansdk
      id: cache-vulkansdk
      uses: actions/cache@v4
      with:
        path: "${{ env.VULKAN_SDK_VERSION }}"
        key: vulkansdk-linux-x86_64-${{ env.VULKAN_SDK_VERSION }}-v2
    - name: setup-vulkansdk
      if: steps.cache-vulkansdk.outputs.cache-hit != 'true'
      run: |
        wget https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_SDK_VERSION }}/linux/vulkansdk-linux-x86_64-${{ env.VULKAN_SDK_VERSION }}.tar.xz?Human=true -O vulkansdk-linux-x86_64-${{ env.VULKAN_SDK_VERSION }}.tar.xz
        tar -xf vulkansdk-linux-x86_64-${{ env.VULKAN_SDK_VERSION }}.tar.xz
        rm -rf ${{ env.VULKAN_SDK_VERSION }}/source ${{ env.VULKAN_SDK_VERSION }}/samples
    - name: Build
      run: |
        # Copy Vulkan 1.4 Loader to the expected lib directory
        cp -d ${{ env.VULKAN_SDK_VERSION }}/x86_64/lib/VulkanLoader/lib/libvulkan.so* ${{ env.VULKAN_SDK_VERSION }}/x86_64/lib/
        export VULKAN_SDK=`pwd`/${{ env.VULKAN_SDK_VERSION }}/x86_64
        mkdir build && cd build
        cmake ../src
        cmake --build . -j 2
